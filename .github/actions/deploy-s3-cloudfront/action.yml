name: 'Deploy to S3'
description: 'Builds and deploys to S3'
inputs:
  aws-access-key-id:
    description: 'AWS Access Key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS Secret Access Key'
    required: true
  aws-region:
    description: 'AWS Region'
    required: true
    default: 'us-east-1'
  s3-bucket-name:
    description: 'S3 Bucket Name'
    required: true
  cloudfront-distribution-id:
    description: 'CloudFront Distribution ID'
    required: true
  deploy-empty:
    description: 'Deploy an empty page instead of the docs site'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:

    - name: Setup Node.js
      if: inputs.deploy-empty != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      if: inputs.deploy-empty != 'true'
      shell: bash
      run: npm ci

    - name: Build
      if: inputs.deploy-empty != 'true'
      shell: bash
      run: npm run build

    - name: Create empty page
      if: inputs.deploy-empty == 'true'
      shell: bash
      run: |
        mkdir -p build
        cat > build/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Octez Connect</title>
        </head>
        <body></body>
        </html>
        EOF

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Sync to S3
      shell: bash
      run: |
        aws s3 sync ./build s3://${{ inputs.s3-bucket-name }}/ --delete

    - name: Invalidate CloudFront
      shell: bash
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ inputs.cloudfront-distribution-id }} --paths "/*"
